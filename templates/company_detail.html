<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ company_name }} Interview Preparation</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* ===== Container & Layout ===== */
body {
    font-family: 'Poppins', sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 50px auto;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    padding: 40px;
}

.header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.header img {
    width: 120px;
    height: 120px;
    border-radius: 15px;
    object-fit: contain;
    border: 2px solid #ddd;
    background: #fff;
}

.header h1 {
    font-size: 2rem;
    color: #2c3e50;
    margin: 0;
}

/* ===== Focus Skills Section ===== */
.skills-section {
    margin-top: 30px;
}

.skills-section h2 {
    color: #34495e;
    margin-bottom: 20px;
}

.skills-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.skills-list li {
    background: #3498db;
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    list-style: none;
    text-align: center;
    font-weight: 500;
    transition: transform 0.3s, box-shadow 0.3s;
}

.skills-list li:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* ===== Buttons ===== */
button, .back-btn {
    background: #27ae60;
    color: #fff;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
    margin-top: 30px;
    display: inline-block;
}

button:hover, .back-btn:hover {
    background: #2ecc71;
}

/* ===== Responsive ===== */
@media screen and (max-width: 600px) {
    .header {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .header img {
        width: 100px;
        height: 100px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <img src="{{ logo }}" alt="{{ company_name }} Logo">
        <h1>{{ company_name }} Interview Preparation</h1>
    </div>

    <p style="color: #7f8c8d; font-size: 16px;">
        Focus on the most important skills and topics for {{ company_name }} interviews.
    </p>

    <div class="skills-section">
        <h2>Skills to Focus</h2>
        <ul class="skills-list">
            {% for skill in company_skills %}
            <li>{{ skill }}</li>
            {% endfor %}
        </ul>
    </div>

    <a href="/company_prep" class="back-btn">Back to Company List</a>

</div>

</body>
</html>
