<!DOCTYPE html>
<html>

<head>

<title>Result</title>

<style>

body{
font-family:Poppins, sans-serif;
background:
radial-gradient(circle at top right, rgba(255,215,0,0.15), transparent 40%),
linear-gradient(135deg,#0b1d3a,#0f2a4a,#1a365d);
color:white;
padding:50px;
line-height:1.6;
}

/* Score Title */

h1{
font-size:40px;
color:#facc15;
margin-bottom:30px;
text-align:center;
letter-spacing:1px;
}

/* Review Title */

h2{
font-size:28px;
margin-bottom:25px;
color:#38bdf8;
text-align:center;
}

/* Result Cards */

p{
background:rgba(15,23,42,0.85);
padding:20px 25px;
border-radius:14px;
margin-bottom:18px;
border:1px solid rgba(56,189,248,0.25);
box-shadow:0 8px 25px rgba(0,0,0,0.5);
transition:0.25s;
}

/* Hover effect */

p:hover{
transform:translateY(-2px);
border:1px solid rgba(56,189,248,0.7);
box-shadow:0 0 12px rgba(56,189,248,0.35);
}

/* Question */

b{
font-size:18px;
color:#e2e8f0;
}

/* Correct answer */

.correct{
color:#22c55e;
font-weight:600;
}

/* User answer */

p br + text{
color:#f87171;
}

</style>

</head>

<body>

<h1>Your Score : {{score}} / {{total}}</h1>

<h2>Answer Review</h2>

{% for r in results %}

<p>

<b>{{loop.index}}. {{r.question}}</b><br>

Your Answer : {{r.user}}<br>

Correct : <span class="correct">{{r.correct}}</span>

</p>

{% endfor %}

</body>

</html>
